# NOTE: deliberately no `org.gradle.java.home` here.
#
# It used to hardcode an absolute JDK path, which broke the project on any other machine.
# Use ./dt instead of ./gradlew — it resolves an installed JDK 21 via macOS's
# /usr/libexec/java_home, so nothing machine-specific needs to live in this file.
#
# If you prefer plain ./gradlew, either make JDK 21 your default `java` or set JAVA_HOME
# yourself. A per-machine override belongs in ~/.gradle/gradle.properties, not here.

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
