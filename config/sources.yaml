# Providers to poll.
#
# `type` selects the protocol adapter; everything else is data. Adding a site
# that speaks a protocol already implemented is a new block here and no code:
#   - another VTEX retailer  -> type: vtex
#   - another Slickdeals RSS -> type: rss-slickdeals
#   - another ML country     -> type: mercadolibre, change siteId
#
# A genuinely new platform (Rappi, or a bespoke HTML site) needs a new adapter
# class plus one line in SourceRegistry.

defaults:
  minDiscountPercent: 25.0
  pollIntervalMinutes: 60
  userAgent: "deals-tracker/0.1 (personal price monitor)"
  perHostDelayMillis: 1200
  httpPort: 8080

  # --- Feed ranking ---
  # How often the default ordering reshuffles among deals of comparable quality, in hours.
  # 0 = off, ordering becomes a pure function of the score.
  #
  # Needed because the score is deterministic and most of its inputs never move: only 14.6% of
  # tracked deals have ever changed price, and nothing records what you have already looked at
  # (every deal is still state = NEW -- SEEN is in the enum but nothing writes it). So without
  # this the top of the page is the same list on every visit.
  #
  # The offset is a hash of (deal id, time bucket), so it is stable within a bucket -- reloading
  # does not make rows jump -- and bounded to +/-4 points, which reorders comparable deals but
  # cannot lift a weak one above a strong one. See DealScore.rotating.
  feedRotationHours: 3

  # Warn when this share of active deals has fallen into the 'Other' category. 0 = off.
  # The per-provider percentage printed during ingest is a share of one small batch and reads
  # as noise; this is measured across the stored feed, which is what reflects rule quality.
  # Remedy is ./dt run --args="--recategorize --show-other".
  categoryOtherWarnPercent: 10

  # --- Amazon -> Colombia shipping verification ---
  # Runs headed and assisted: unattended requests from a datacenter IP were blocked after
  # ~7 page loads, and Amazon's wall is a single button only a human can clear. Tune the
  # pacing here rather than in code -- what Amazon tolerates is found empirically.
  coShippingCountry: "Colombia"
  coShippingBatchSize: 10
  coShippingDelayMillis: 15000
  coShippingMaxPerRun: 100

  # Automatic verification: a small headed run after every Nth poll. Set to 0 to turn it
  # off and rely on `./dt verify` alone.
  #
  # 1, i.e. every poll. This was 3, on the reasoning that back-to-back runs would burn
  # session trust for little gain -- but that rested on a "~40-55 page loads before Amazon
  # walls a session" figure measured while a bug was reporting healthy pages as blocked.
  # With that fixed, a 12-deal batch ran clean, so the ceiling is unknown and probably
  # higher than assumed.
  #
  # The decisive reason is simpler: the cycle counter lives in memory, so every app restart
  # sends it back to zero. At 3 the app had to stay up two unbroken hours before verifying
  # anything, and across days of use it never once managed that -- the automatic run had
  # fired exactly zero times in normal operation. At 1 it runs on the first poll after
  # startup, which is the only setting that survives how often this app actually restarts.
  #
  # Note the "Refresh now" button does NOT count: it calls ingest directly and never
  # advances the poller's counter.
  coShippingEveryNPolls: 1
  # 15, not 5. Slickdeals brings 220-313 new deals a day; 5 an hour is 120 and loses ground,
  # so the backlog grew to 503 while looking like it was being worked. 15 an hour is 360 a
  # day -- enough to drain that backlog in about four days of uptime and then keep pace.
  # Costs roughly 6 minutes of browser time per hour at the 15s spacing below.
  coShippingPollBatch: 15
  # Shorter than a manual run's 180s -- nobody is necessarily watching an automatic one,
  # so it should give up and let the next cycle retry rather than hold a window open.
  coShippingPollWallWaitMillis: 45000

providers:
  - id: slickdeals
    type: rss-slickdeals
    enabled: true
    # Every Slickdeals RSS feed is hard-capped at 25 items (pp=100 does not help), but
    # the feeds carry different sets -- frontpage overlaps the others by ZERO, and
    # newdeals is identical to the unfiltered feed. Reading these three gave 71 unique
    # deals vs 25 from any one. Deduped by thread id within this provider.
    url: "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1"
    currency: USD
    # Amazon items may or may not reach Colombia; Luis verifies and the verdict sticks.
    coShippingDefault: UNKNOWN
    options:
      # Slickdeals publishes no list price, so the discount floor can never fire for
      # this source -- it would be filtered to nothing. But the frontpage is already
      # a community-curated deal feed, so every newly seen item is worth surfacing.
      promoteAllNew: "true"
      # Pages to fetch per search term. Each page is 25 items and one cheap request.
      # Only `q=` searches paginate -- `page` is silently ignored on the mode feeds.
      #
      # 3, measured rather than guessed. Age of results by page for q=apple:
      #   page 1 -> 25/25 within 14 days (median   2d)
      #   page 2 -> 13/25 within 14 days (median  14d)
      #   page 3 ->  0/25 within 14 days (median  34d)
      #   page 8 ->  0/25 within 14 days (median 437d)
      # Pages beyond 3 contributed nothing fresh, just wasted requests. The search
      # window also shifts between requests, so repeated polls still accumulate
      # coverage beyond any single run.
      searchPages: "3"

      # Drop deals the source published more than this many days ago.
      #
      # Essential, not just an optimisation: search results are NOT ordered strictly by
      # date (page 7 came back newer than page 6), so capping page depth cannot bound
      # age on its own. Without this the feed accumulated deals from 2025.
      # Ignored for sources that publish no posting date (VTEX, MercadoLibre).
      maxAgeDays: "14"
    listOptions:
      # Fixed feeds: the curated views. These do NOT paginate.
      urls:
        - "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1"
        - "https://slickdeals.net/newsearch.php?mode=popdeals&searcharea=deals&searchin=first&rss=1"
        - "https://slickdeals.net/newsearch.php?mode=newdeals&searcharea=deals&searchin=first&rss=1"

      # Paginated searches. This is the ONLY way to reach deals older than the ~25
      # most recent, which is why a deal that is visible on slickdeals.net/deals/apple
      # as "2w ago" never shows up in the mode feeds above.
      #
      # "amazon" is a broad sweep that suits this provider's Amazon-only filter.
      # Add your own interests -- each term costs searchPages requests per poll.
      searches:
        - "amazon"
        - "apple"

      # The merchant filter is config, not an if-branch. Add "best-buy" here if
      # you ever start using a package forwarder.
      allowedMerchants: ["amazon"]

      # Amazon ships internationally, but NOT groceries, liquids or medicines -- and
      # bulky low-value consumables are not worth shipping to Colombia even when
      # allowed. Excluding them keeps the manual shipping check focused.
      #
      # Case-insensitive regex, matched against the title. Same list drives
      # `--fetch-once` filtering and `--purge-excluded` cleanup, so they cannot drift.
      # Delete any line you disagree with; run --purge-excluded --dry-run to preview.
      excludeTitlePatterns:
        # Amazon's own grocery private labels -- the single clearest signal.
        - "Amazon Grocery"
        - "Amazon Fresh"
        - "Amazon Saver"
        - "Happy Belly"
        - "Wickedly Prime"
        # Subscribe & Save. Marks consumables generally: food, OTC medicine (TUMS,
        # Neosporin, allergy tablets), paper goods and personal care. Broader than
        # "grocery" but everything it catches is restricted or uneconomic to ship.
        # Remove these two lines if you want household consumables back.
        - "\\bS&S\\b"
        - "\\bSnS\\b"
        # Food and drink nouns, for grocery deals with no S&S marker.
        - "\\b(juice|soda|coffee|tea|cereal|granola|oatmeal|cookies?|candy|chocolate)\\b"
        - "\\b(snacks?|chips|cashews?|almonds|peanuts|pretzels|crackers)\\b"
        - "\\b(sauce|ketchup|mustard|mayo|soup|pasta|noodles|seasoning|syrup)\\b"
        - "\\b(gatorade|soylent|protein powder)\\b"
        # Supplements and OTC medicine -- restricted for international shipping.
        - "\\b(vitamins?|multivitamin|supplements?|antacid|antihistamine|ibuprofen)\\b"

  - id: exito
    type: vtex
    enabled: true
    baseUrl: "https://www.exito.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      # VTEX caps a page at 50; small windows keep the ~19MB-per-50 payloads manageable.
      # Grocery pages are much lighter than tech (~1.5MB vs ~3.2MB per 24), which is what
      # makes the grocery breadth below affordable.
      pageSize: "24"
      maxPagesPerCategory: "3"
    listOptions:
      # Walked in VTEX's DEFAULT order, which is best-sellers (an unordered request returns
      # results identical to O=OrderByTopSaleDESC). Right for these two: they are broad, and
      # sorting them by discount surfaces marketplace listings with inflated list prices --
      # `tecnologia` leads with a 95%-off webcam.
      #
      # Mercado is listed last deliberately: it is the largest and fastest-churning
      # catalog, so if it gets throttled the other two have already landed. It is kept
      # despite the subcategories below because its best-seller view is the popular-staples
      # baseline (leche, huevos, arroz) that a discount sort never returns.
      categories: ["tecnologia", "electrodomesticos", "mercado"]

      # Walked sorted by advertised discount (O=OrderByBestDiscountDESC).
      #
      # This is how the store's actual promotions get in. Measured: `mercado` holds 65,966
      # products, so 3 pages of 24 reaches 0.1% of it -- and in best-seller order that 0.1%
      # is a fixed set of full-price staples, re-fetched unchanged every hour. Meanwhile a
      # real 40%-off meat promotion (picanha, New York strip, entraña) sat permanently out
      # of reach. Giving each grocery subcategory its own budget AND sorting it by discount
      # is what surfaces those; `pollo-carne-y-pescado` alone has 2,406 products.
      #
      # Discount sort stays trustworthy here in a way it does not for `tecnologia`, because
      # these are narrow single-purpose categories of ordinary supermarket goods with few
      # third-party sellers to inflate a list price.
      #
      # NOTE these are NESTED paths -- Exito files groceries under `mercado/`, while Carulla
      # has the equivalents at top level. Slug validation walks the full tree, so a typo
      # still gets caught rather than silently returning unfiltered products.
      bestDiscountCategories:
        - "mercado/pollo-carne-y-pescado"
        - "mercado/frutas-y-verduras"
        - "mercado/lacteos-huevos-y-refrigerados"
        - "mercado/despensa"
        - "mercado/congelados"
        - "mercado/charcuteria-y-delicatessen"
        - "mercado/panaderia-y-reposteria"
        - "mercado/bebidas"

  - id: carulla
    type: vtex
    # Same VTEX platform as Exito, so this integration is config only -- but the
    # taxonomy is NOT the same. Verified against carulla.com's own category tree:
    # Carulla is grocery-first and has NO "mercado" category. Groceries are split
    # into despensa / lacteos-huevos-y-refrigerados / frutas-y-verduras / etc.
    #
    # Beware: requesting a category that does not exist does NOT return 404. VTEX
    # answers 206 with an unfiltered product list, so a wrong slug here yields
    # plausible-looking but arbitrary results. VtexSource validates these slugs
    # against the live category tree on startup and warns.
    enabled: true
    baseUrl: "https://www.carulla.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      pageSize: "24"
      maxPagesPerCategory: "2"
    listOptions:
      # Broad categories, so default (best-seller) order -- see the note on Exito's.
      categories: ["tecnologia", "electrodomesticos"]

      # Sorted by advertised discount, same reasoning as Exito's. `despensa` moves here
      # from `categories`: it holds 10,545 products, so best-seller order was returning a
      # fixed sliver of full-price staples.
      #
      # These are TOP-LEVEL here, unlike Exito, because Carulla is grocery-first and has no
      # `mercado` parent at all. Note the meat slug also differs by a letter -- Carulla's is
      # `pollo-carnes-y-pescado` (plural), Exito's is `pollo-carne-y-pescado`. Both verified
      # against each store's live tree.
      bestDiscountCategories:
        - "pollo-carnes-y-pescado"
        - "frutas-y-verduras"
        - "lacteos-huevos-y-refrigerados"
        - "despensa"
        - "congelados"
        - "panaderia"
        - "delicatessen"
        - "bebidas-snacks-y-dulces"

  - id: easy
    type: vtex
    # Cencosud's Colombian home-improvement chain, and the only one of the five retailers
    # asked for (Homecenter, Makro, Easy, Falabella, Corona) that needs no new code.
    # Verified 2026-09-08 on the live API: VTEX account `easycolombia`, HTTP 206 on
    # _from/_to, working /category/tree/1, real commertialOffer prices, and real GS1 EANs
    # (7800155560700, 7702437018230) so it feeds cross-site product matching properly.
    # `https://www.easy.com.co/{linkText}/p` resolves without the internal-hostname trap
    # documented in VtexSource.
    #
    # Slugs below were read from its OWN tree, not copied from Exito -- Carulla proved they
    # do not transfer between VTEX stores. VtexSource re-validates on startup and warns.
    #
    # Worth knowing when reading the feed: this is a hardware store, so "nevera" here means
    # cooler boxes and picnic hampers far more often than refrigerators. That is not a
    # misconfiguration; it is why a watch has a minimum price.
    enabled: true
    baseUrl: "https://www.easy.com.co"
    currency: COP
    coShippingDefault: "YES"
    options:
      pageSize: "24"
      maxPagesPerCategory: "2"
    listOptions:
      categories: ["electrodomesticos", "tecnologia", "cocinas", "televisores-y-audio", "banos"]

  - id: olimpica
    type: vtex
    # Found the way the next retailer should be found: a Google search for a model code
    # (RS57DG4000B4CO) listed merchants we do not poll. Rather than scrape Google -- whose
    # robots.txt disallows /search, and whose data has no price history -- the merchants it
    # names get added here as first-class sources.
    #
    # Verified 2026-09-08: plain VTEX, HTTP 206 on _from/_to, and `?ft=RS57DG4000B4CO`
    # returns that Samsung with ean 8806095746456 -- the same GTIN already held from Carulla,
    # so it clusters into the cross-site comparison with no extra work.
    #
    # Slugs read from its own /category/tree/1, not guessed. Note it files appliances and
    # electronics together under one top-level category.
    enabled: true
    baseUrl: "https://www.olimpica.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      pageSize: "24"
      maxPagesPerCategory: "2"
    listOptions:
      categories: ["electrodomesticos-y-tecnologia", "hogar-cocina"]

  - id: homecenter
    type: falabella-next
    # Sodimac Colombia. NOT VTEX -- /api/catalog_system/... answers 404. It runs the same
    # falabella-b2c-ui Next.js build as falabella.com.co, so one adapter serves both and the
    # only differences are the two options below.
    #
    # SEARCH IS DELIBERATELY OFF. robots.txt disallows "*/search?" and "/homecenter-co/search/"
    # for generic agents, while category pages are allowed. `searchEnabled` defaults to false
    # so this fails safe: without it, the watch terms IngestService injects into `searches`
    # would silently start hitting disallowed URLs. Homecenter is therefore matched by watches
    # on what its category crawl brings back, not by keyword.
    enabled: true
    baseUrl: "https://www.homecenter.com.co"
    currency: COP
    coShippingDefault: "YES"
    options:
      # Path segment after the host, and where the results sit inside __NEXT_DATA__.
      storePath: "homecenter-co"
      resultsPath: "searchProps.searchData"
      # Each page is a 1.6MB HTML fetch, so keep the budget small. 40 products per page.
      maxPagesPerCategory: "2"
    listOptions:
      # Category ids are opaque, so the id and its slug are kept together in one string --
      # they cannot then drift apart. Copy a path straight out of a category URL to add one.
      # Verified 2026-09-08 against the live site.
      categories:
        - "category/cat10850/neveras-y-nevecones"
        - "category/cat4710026/neveras-no-frost"
        - "category/cat450001/lavadoras"
        - "category/cat870002/electrodomesticos-de-cocina"
        - "category/cat740116/televisores-y-smart-tv"
        - "category/cat40446128/sanitarios-y-combos-sanitarios"
        - "category/cat90039/combos-sanitarios"

  - id: falabella
    type: falabella-next
    # Same platform and same adapter as Homecenter. Two differences: results sit directly on
    # pageProps (no resultsPath), and its robots.txt allows search -- `User-agent: *` gets an
    # empty `Disallow:` -- so watch terms can drive real keyword queries here.
    #
    # Read the merchant column: Falabella's marketplace includes third-party sellers, and one
    # of them is Homecenter itself. A "Falabella is cheaper than Homecenter" gap where the
    # Falabella seller IS Homecenter is not an independent comparison. The adapter records
    # sellerName as the merchant so this is visible rather than hidden.
    enabled: true
    baseUrl: "https://www.falabella.com.co"
    currency: COP
    coShippingDefault: "YES"
    options:
      storePath: "falabella-co"
      searchEnabled: "true"
      # ~2MB per page and 48-56 products, so one page per term goes a long way.
      maxPagesPerSearch: "1"
      maxPagesPerCategory: "2"
    listOptions:
      # Seed terms; every enabled watch's terms are merged in on top of these.
      searches:
        - "nevera"
      categories: []

  - id: fullhogar
    type: shopify
    # The nicest source here: every Shopify store exposes /collections/<handle>/products.json
    # as documented, stable, first-party JSON. No HTML, no embedded island, no private BFF.
    #
    # Handles read from its own /collections.json (109 of them), not guessed.
    #
    # Note many rows come back out of stock; the adapter keeps only `available` ones, since
    # advertising a price you cannot buy would also plant a phantom rival in the cross-site
    # comparison. It publishes no barcode, so identity is brand plus the title's model code.
    enabled: true
    baseUrl: "https://www.fullhogar.com.co"
    currency: COP
    coShippingDefault: "YES"
    options:
      # Shopify allows up to 250. A page is one request either way, and a smaller window is
      # gentler on a small retailer.
      pageSize: "50"
      maxPagesPerCollection: "2"
    listOptions:
      collections: ["neveras", "nevecones", "refrigeracion", "televisores", "lavadoras"]

  - id: grupomansion
    type: prestashop
    # Added because a Google search for a model code found it selling a Samsung side-by-side
    # at 2,999,000 while the cheapest source here had it at 3,299,900 -- the gap that showed
    # "cheaper elsewhere" only ever meant "cheaper among the sources we poll".
    #
    # Unlike vtex/shopify this reads a THEME's product grid, not an API, so the selectors are
    # options rather than constants and a different PrestaShop store may need them adjusted.
    # The default theme is generous, though: each tile carries an unformatted integer price in
    # `content`, the was-price, the manufacturer reference (the model code), and the EAN
    # appended to the URL slug -- which is what makes it join existing GTIN clusters.
    #
    # Category paths are "<id>-<slug>", taken from the site's own nav.
    enabled: true
    baseUrl: "https://www.grupomansion.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      maxPagesPerCategory: "2"
    listOptions:
      categories:
        - "15-refrigeracion"
        - "14-lavadoras-y-secadoras"
        - "10-audio-y-video"
        - "12-cocina"

  - id: alkomprar
    type: algolia
    # Alkosto's sister brand. NOT VTEX (404 on catalog_system) -- its storefront search runs on
    # Algolia, and the front end ships the app id and a SEARCH-ONLY key in the page, which is how
    # every Algolia site works. Both verified 2026-09-15 before use: the key's ACL is exactly
    # ["search"], and an addObject attempt is refused 403. Public config, not a secret, so it
    # belongs here rather than in local.properties.
    #
    # Best data of any source after Shopify: one POST returns price, was-price, an explicit stock
    # flag, brand, category path, images -- and the EAN as the product code, so these rows join
    # existing GTIN clusters immediately. It has the MABE MSL480LMLPS0 at 2,549,900, under the
    # 2,999,000 that a Google search turned up at Grupo Mansion.
    #
    # Browsed by category facet, NOT keyword: robots.txt disallows /search/ and *?q=. Those rules
    # govern the storefront rather than the Algolia host, but honouring the site's evident intent
    # is the same call made for Homecenter. Facet values below came from the index's own facet
    # list, so they are its categories rather than guesses.
    enabled: true
    baseUrl: "https://www.alkomprar.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      algoliaAppId: "QX5IPS1B1Q"
      algoliaSearchKey: "7a8800d62203ee3a9ff1cdf74f99b268"
      algoliaIndex: "alkomprarIndexAlgoliaPRD"
      categoryFacet: "allcategories_string_mv"
      pageSize: "20"
      maxPagesPerCategory: "2"
    listOptions:
      categories:
        - "neveras-no-frost"
        - "nevera-dos-puertas"
        - "televisores-grandes"
        - "televisores-led"
        - "lavadoras-carga-superior"

  - id: amazon
    type: amazon
    # Tracks SPECIFIC items in YOUR size, which is what the slickdeals provider above cannot
    # do -- that feed carries whatever the community happened to post, so a Nike hoodie only
    # appears if a stranger submitted it.
    #
    # Why this is not just another search sweep: on Amazon a size is a DISTINCT CHILD ASIN
    # with its own price and stock. Every other adapter here collapses variants to the
    # cheapest one (see ShopifySource, VtexSource); doing that for clothing would faithfully
    # report the price of a garment that does not fit. So one deal row = one child ASIN =
    # one size.
    #
    # robots.txt was checked before writing this (2026-09-17): `User-agent: *` gets no rule
    # against /s or /dp/, only against sub-paths like /dp/shipping/. The blanket
    # `Disallow: /` entries in that file target named AI crawlers (ClaudeBot, GPTBot and so
    # on), which this is not -- it sends the project's own descriptive user agent.
    #
    # THE REQUEST BUDGET IS THE REAL CONSTRAINT. Measured the same day with that user agent:
    # two requests returned full markup, the THIRD returned 503 "Sorry! Something went
    # wrong!". The adapter escalates to the headed Chrome profile the shipping verifier
    # already maintains (sharing its VerifySlot lock), but a discovery run is still
    # request-heavy and will often be partly refused. It degrades to fewer items, never wrong
    # ones, and repeated polls accumulate coverage the way slickdeals does.
    enabled: true
    baseUrl: "https://www.amazon.com"
    # Nominal only -- the real currency is read off each price string. Amazon served COP to
    # this machine (`COP 234,124.82`) while the slickdeals rows here are USD, so neither is a
    # safe constant. See AmazonMoney.
    currency: COP
    # Same as slickdeals: Amazon items may or may not reach Colombia, and the existing
    # verifier picks these rows up automatically because they carry an ASIN.
    coShippingDefault: UNKNOWN
    options:
      # SIZES, IN AMAZON'S OWN WORDING. Not abbreviations.
      #
      # Amazon spells letter sizes out -- the adidas pullover checked on 2026-09-17 offers
      # ["Small","Medium","Large","X-Large","XX-Large","3X-Large"], so "M" matches nothing.
      # There is deliberately no alias table: guessing "M" -> "Medium" would resolve to a
      # real ASIN of the wrong size, and a wrong size is worse than tracking nothing.
      #
      # Matching is EXACT, never a prefix. One Nike Air Force 1 listing offers "8",
      # "8 Wide", "8 X-Wide", "8.5" and "8 Women/7 Men" -- a prefix match on "8" hits all
      # five, four of which are the wrong shoe.
      # Amazon's SHORT labels, as used in its own search-filter rail: 8 / M / S.
      #
      # NOT the spelled-out forms (`Medium`, `Small`). Both are Amazon's own wording for the same
      # size, but in different places: the product page's variation data says "Medium" while the
      # left-hand refinement rail says "M", and it is the rail this now reads. A mismatch is
      # reported by name at the end of a run, never guessed around.
      sizeShoes: "8"
      sizeTops: "M"
      sizeBottoms: "S"

      # Distinct items to keep per search term.
      #
      # 20, raised from 8. Sizing no longer costs a request per item -- Amazon filters server-side
      # -- and a size-filtered page yields ~45 usable tiles, so 8 was throwing most of a page away.
      # Counts DISTINCT items: the same ASIN found under two terms consumes one slot, not two.
      maxItemsPerSearch: "20"

      # Result pages to walk per search term.
      #
      # Paging is a plain `&page=N` parameter. The results UI loads more on scroll, which makes it
      # look like there is no URL to fetch, but Amazon still ships a numbered pager whose links are
      # ordinary URLs -- those are what this follows.
      #
      # Verified against the live site 2026-09-21: pages 1-3 each returned 48 tiles, the `rh` size
      # filter stayed applied on every one, and the overlap between pages was ZERO (130 distinct
      # items across three). So depth genuinely multiplies coverage rather than re-reading rows.
      #
      # 2, not 3. Each extra page is another request against a host that refuses intermittently,
      # and refusals -- not code -- are the binding constraint. Two pages already offer ~90 usable
      # tiles per search, comfortably past maxItemsPerSearch. Raise it if the logs stay clean.
      maxPagesPerSearch: "2"

      # Escalate to the trusted headed Chrome profile when plain HTTP is throttled. Set to
      # false to stay HTTP-only, which is quieter but will resolve very few items.
      allowBrowserFallback: "true"

      # Selectors are config, not constants -- same call PrestashopSource makes, and for the
      # same reason: this reads a rendered storefront rather than a documented API, and
      # Amazon reorganises its markup. Defaults are verified against the captures in
      # src/test/resources/fixtures/amazon/. Override here if a fetch starts reporting
      # "0 usable results" from a non-zero tile count.
      #   resultTileSelector, resultTitleSelector, resultBrandSelector,
      #   resultPriceSelector, resultImageSelector, productTitleSelector,
      #   productPriceSelector, productAvailabilitySelector
    listOptions:
      # NOTE the key is `trackSearches`, not `searches`, and that is deliberate.
      #
      # IngestService merges every enabled watch's terms into every provider's `searches`.
      # That is right for a general retailer and wrong here: the first live run searched
      # amazon.com for `inodoro`, `televisor` and `nevera` because watches for a toilet, a TV
      # and a fridge were enabled, spending 9 of 15 search requests -- against a source that
      # starts refusing on the third -- on items this provider cannot size. Reading a key
      # injection does not touch means opting out is structural rather than a flag to
      # remember. Watches still reach Amazon through the slickdeals provider, as before.
      #
      # Garment type is inferred from the term (shoe/sneaker -> shoes, hoodie/shirt -> tops,
      # pant/jogger -> bottoms), so adding a search does not mean also declaring its type.
      # Each term costs one search request plus up to maxItemsPerSearch product fetches on
      # the first run, and far fewer afterwards.
      trackSearches:
        - "nike men running shoes"
        - "adidas men shoes"
        - "nike men hoodie"
        - "adidas men hoodie"
        - "nike men pants"
        - "adidas men pants"
        # Shirts take sizeTops, same as hoodies -- `shirt` is in Garment's TOP_WORDS, and both
        # resolve to Amazon's `international_size` rail. Worth knowing they compete for the same
        # per-search budget rather than adding a new size dimension.
        - "nike men shirt"
        - "adidas men shirt"
        # New Balance. Needs no code and no new size values: the garment type is inferred from the
        # term, and the size refinement id is discovered from each search's own page, so a brand is
        # purely three more lines here.
        #
        # Note "new balance men shoes" carries `shoe`, so it takes sizeShoes; the other two carry
        # `shirt` and `pant` and take sizeTops / sizeBottoms.
        - "new balance men shoes"
        - "new balance men shirt"
        - "new balance men pants"
        # Boxers, all three brands. Underwear uses the SAME `international_size` rail as shirts and
        # pants -- verified on a live boxer search, where S is node 2475467011, identical to pants --
        # so this needs no new size value, just the term and a `boxer` noun in Garment/ProductType.
        - "nike men boxer"
        - "adidas men boxer"
        - "new balance men boxer"

  - id: mercadolibre-co
    type: mercadolibre
    # DISABLED: blocked by MercadoLibre, not by a bug here.
    #
    # Auth works -- client_credentials issues a valid user-scoped token, and
    # /users/me and /categories/{id} both return 200 with it. But every search and
    # browse endpoint (/sites/MCO/search, /products/search, /highlights/...) returns
    # 403 PA_UNAUTHORIZED_RESULT_FROM_POLICIES. Registering an app is not enough;
    # MercadoLibre gates catalog search behind separate approval.
    #
    # Two ways forward, both pending a decision: request search access for this app,
    # or read the server-rendered /ofertas pages instead (prices ARE in that HTML,
    # and robots.txt does not disallow /ofertas for generic agents).
    enabled: false
    siteId: MCO
    currency: COP
    coShippingDefault: "YES"
    options:
      # App credentials (ml.clientId and ml.clientSecret) live in gitignored
      # local.properties, never here -- config/sources.yaml is committed.
      pageSize: "50"
    listOptions:
      # MCO1051 Celulares, MCO1000 Electrónica/Audio/Video,
      # MCO1403 Alimentos y Bebidas, MCO1574 Hogar/Electrodomésticos
      categories: ["MCO1051", "MCO1000", "MCO1574", "MCO1403"]

  - id: rappi-medellin
    type: rappi
    # Deferred: services.rappi.com.co does not resolve and robots.txt disallows
    # /api, /api-services and /base-api. Flip to true once an adapter exists.
    enabled: false
    currency: COP
    coShippingDefault: "YES"
    options:
      city: "medellin"
