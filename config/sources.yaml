# Providers to poll.
#
# `type` selects the protocol adapter; everything else is data. Adding a site
# that speaks a protocol already implemented is a new block here and no code:
#   - another VTEX retailer  -> type: vtex
#   - another Slickdeals RSS -> type: rss-slickdeals
#   - another ML country     -> type: mercadolibre, change siteId
#
# A genuinely new platform (Rappi, or a bespoke HTML site) needs a new adapter
# class plus one line in SourceRegistry.

defaults:
  minDiscountPercent: 25.0
  pollIntervalMinutes: 60
  userAgent: "deals-tracker/0.1 (personal price monitor)"
  perHostDelayMillis: 1200
  httpPort: 8080

  # --- Currency ---
  # Pesos per US dollar, used ONLY when Colombia's official TRM cannot be fetched. Watches compare
  # Amazon's USD prices with Colombian retailers in COP; the live rate comes from datos.gov.co
  # (dataset 32sa-8pi3) once a day, and an alert that rests on this fallback says so.
  usdCopRate: 3200

  # --- Feed ranking ---
  # How often the default ordering reshuffles among deals of comparable quality, in hours.
  # 0 = off, ordering becomes a pure function of the score.
  #
  # Needed because the score is deterministic and most of its inputs never move: only 14.6% of
  # tracked deals have ever changed price, and nothing records what you have already looked at
  # (every deal is still state = NEW -- SEEN is in the enum but nothing writes it). So without
  # this the top of the page is the same list on every visit.
  #
  # The offset is a hash of (deal id, time bucket), so it is stable within a bucket -- reloading
  # does not make rows jump -- and bounded to +/-4 points, which reorders comparable deals but
  # cannot lift a weak one above a strong one. See DealScore.rotating.
  feedRotationHours: 3

  # Warn when this share of active deals has fallen into the 'Other' category. 0 = off.
  # The per-provider percentage printed during ingest is a share of one small batch and reads
  # as noise; this is measured across the stored feed, which is what reflects rule quality.
  # Remedy is ./dt run --args="--recategorize --show-other".
  categoryOtherWarnPercent: 10

  # --- Amazon -> Colombia shipping verification ---
  # Runs headed and assisted: unattended requests from a datacenter IP were blocked after
  # ~7 page loads, and Amazon's wall is a single button only a human can clear. Tune the
  # pacing here rather than in code -- what Amazon tolerates is found empirically.
  coShippingCountry: "Colombia"
  coShippingBatchSize: 10
  coShippingDelayMillis: 15000
  coShippingMaxPerRun: 100

  # Automatic verification: a small headed run after every Nth poll. Set to 0 to turn it
  # off and rely on `./dt verify` alone.
  #
  # 1, i.e. every poll. This was 3, on the reasoning that back-to-back runs would burn
  # session trust for little gain -- but that rested on a "~40-55 page loads before Amazon
  # walls a session" figure measured while a bug was reporting healthy pages as blocked.
  # With that fixed, a 12-deal batch ran clean, so the ceiling is unknown and probably
  # higher than assumed.
  #
  # The decisive reason is simpler: the cycle counter lives in memory, so every app restart
  # sends it back to zero. At 3 the app had to stay up two unbroken hours before verifying
  # anything, and across days of use it never once managed that -- the automatic run had
  # fired exactly zero times in normal operation. At 1 it runs on the first poll after
  # startup, which is the only setting that survives how often this app actually restarts.
  #
  # Note the "Refresh now" button does NOT count: it calls ingest directly and never
  # advances the poller's counter.
  coShippingEveryNPolls: 1
  # 20, raised from 15 (which was itself raised from 5, when the backlog had grown to 503
  # while the log made it look like progress). Measured 2026-09-23: 1,179 of 1,688 active
  # Amazon rows were still UNKNOWN, against 336 YES and 173 NO -- so the queue was still
  # oversubscribed at 15 an hour (360 a day). 20 is 480 a day.
  #
  # 40, raised from 20 (2026-09-24), with Tracked rows now taking the queue first -- see
  # `prioritySources` in CoShippingConfig. The Tracked tab had 780 of ~970 active rows unchecked
  # after its searches were deepened, and was getting only ~190 checks a day out of a queue shared
  # with Slickdeals. Chrome being open ~10 minutes an hour is accepted. Watch the log for
  # "[STOPPED EARLY: Amazon was blocking]" and step back to 30 if it appears.
  #
  # 50, raised from 40 (2026-09-24) after the first 40-item run came back clean: 40 checked,
  # 0 unclear, no wall. ~13 minutes of browser time an hour. With AmazonSource's pages this is
  # ~110 Amazon page loads per cycle, so if a wall appears, 40 is the known-good step back.
  #
  # This is a verification knob, NOT a fetch knob: it decides how many EXISTING deals get a
  # /dp/ page load to read their Colombia delivery block. It adds no deals and no price
  # observations. It matters to the feed because an unverified row scores as though shipping
  # were free -- DealScore's freight term is the largest single penalty in the ranking (60
  # points) and sits at zero until a verdict exists.
  #
  # Why not higher: Amazon page loads per cycle are now ~68 (45 for AmazonSource's 15 terms x
  # 3 pages, 20 here, 3 for the manual refresh), against a documented headed-session ceiling
  # of 40-55 -- a figure measured while a false wall detection was miscounting, so the real
  # ceiling is unknown and this is already past it with no refusals in the logs. That is
  # headroom of unknown depth, so it gets spent in steps. Raise again if a week passes with
  # no "[STOPPED EARLY: Amazon was blocking]" line.
  #
  # Costs roughly 5 minutes of browser time per hour at the 15s spacing below. Still bounded
  # by coShippingMaxPerRun (100), and diminishing: the queue is ordered by DealScore, so item
  # 20 is by construction less attractive than item 15.
  coShippingPollBatch: 50
  # Shorter than a manual run's 180s -- nobody is necessarily watching an automatic one,
  # so it should give up and let the next cycle retry rather than hold a window open.
  coShippingPollWallWaitMillis: 45000

providers:
  - id: slickdeals
    type: rss-slickdeals
    enabled: true
    # Every Slickdeals RSS feed is hard-capped at 25 items (pp=100 does not help), but
    # the feeds carry different sets -- frontpage overlaps the others by ZERO, and
    # newdeals is identical to the unfiltered feed. Reading these three gave 71 unique
    # deals vs 25 from any one. Deduped by thread id within this provider.
    url: "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1"
    currency: USD
    # Amazon items may or may not reach Colombia; Luis verifies and the verdict sticks.
    coShippingDefault: UNKNOWN
    options:
      # Slickdeals publishes no list price, so the discount floor can never fire for
      # this source -- it would be filtered to nothing. But the frontpage is already
      # a community-curated deal feed, so every newly seen item is worth surfacing.
      promoteAllNew: "true"
      # Pages to fetch per search term. Each page is 25 items and one cheap request.
      # Only `q=` searches paginate -- `page` is silently ignored on the mode feeds.
      #
      # 3, measured rather than guessed. Age of results by page for q=apple:
      #   page 1 -> 25/25 within 14 days (median   2d)
      #   page 2 -> 13/25 within 14 days (median  14d)
      #   page 3 ->  0/25 within 14 days (median  34d)
      #   page 8 ->  0/25 within 14 days (median 437d)
      # Pages beyond 3 contributed nothing fresh, just wasted requests. The search
      # window also shifts between requests, so repeated polls still accumulate
      # coverage beyond any single run.
      searchPages: "3"

      # Drop deals the source published more than this many days ago.
      #
      # Essential, not just an optimisation: search results are NOT ordered strictly by
      # date (page 7 came back newer than page 6), so capping page depth cannot bound
      # age on its own. Without this the feed accumulated deals from 2025.
      # Ignored for sources that publish no posting date (VTEX, MercadoLibre).
      maxAgeDays: "14"
    listOptions:
      # Fixed feeds: the curated views. These do NOT paginate.
      urls:
        - "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1"
        - "https://slickdeals.net/newsearch.php?mode=popdeals&searcharea=deals&searchin=first&rss=1"
        - "https://slickdeals.net/newsearch.php?mode=newdeals&searcharea=deals&searchin=first&rss=1"

      # Paginated searches. This is the ONLY way to reach deals older than the ~25
      # most recent, which is why a deal that is visible on slickdeals.net/deals/apple
      # as "2w ago" never shows up in the mode feeds above.
      #
      # "amazon" is a broad sweep that suits this provider's Amazon-only filter.
      # Add your own interests -- each term costs searchPages requests per poll.
      searches:
        - "amazon"
        - "apple"

      # The merchant filter is config, not an if-branch. Add "best-buy" here if
      # you ever start using a package forwarder.
      allowedMerchants: ["amazon"]

      # Amazon ships internationally, but NOT groceries, liquids or medicines -- and
      # bulky low-value consumables are not worth shipping to Colombia even when
      # allowed. Excluding them keeps the manual shipping check focused.
      #
      # Case-insensitive regex, matched against the title. Same list drives
      # `--fetch-once` filtering and `--purge-excluded` cleanup, so they cannot drift.
      # Delete any line you disagree with; run --purge-excluded --dry-run to preview.
      excludeTitlePatterns:
        # Amazon's own grocery private labels -- the single clearest signal.
        - "Amazon Grocery"
        - "Amazon Fresh"
        - "Amazon Saver"
        - "Happy Belly"
        - "Wickedly Prime"
        # Subscribe & Save. Marks consumables generally: food, OTC medicine (TUMS,
        # Neosporin, allergy tablets), paper goods and personal care. Broader than
        # "grocery" but everything it catches is restricted or uneconomic to ship.
        # Remove these two lines if you want household consumables back.
        - "\\bS&S\\b"
        - "\\bSnS\\b"
        # Food and drink nouns, for grocery deals with no S&S marker.
        - "\\b(juice|soda|coffee|tea|cereal|granola|oatmeal|cookies?|candy|chocolate)\\b"
        - "\\b(snacks?|chips|cashews?|almonds|peanuts|pretzels|crackers)\\b"
        - "\\b(sauce|ketchup|mustard|mayo|soup|pasta|noodles|seasoning|syrup)\\b"
        - "\\b(gatorade|soylent|protein powder)\\b"
        # Supplements and OTC medicine -- restricted for international shipping.
        - "\\b(vitamins?|multivitamin|supplements?|antacid|antihistamine|ibuprofen)\\b"

  - id: exito
    type: vtex
    enabled: true
    baseUrl: "https://www.exito.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      # VTEX caps a page at 50; small windows keep the ~19MB-per-50 payloads manageable.
      # Grocery pages are much lighter than tech (~1.5MB vs ~3.2MB per 24), which is what
      # makes the grocery breadth below affordable.
      pageSize: "24"
      maxPagesPerCategory: "3"
    listOptions:
      # Walked in VTEX's DEFAULT order, which is best-sellers (an unordered request returns
      # results identical to O=OrderByTopSaleDESC). Right for these two: they are broad, and
      # sorting them by discount surfaces marketplace listings with inflated list prices --
      # `tecnologia` leads with a 95%-off webcam.
      #
      # Groceries moved to `exito-grocery` (2026-09-24). This provider used to walk `mercado` plus
      # eight discount-sorted grocery subcategories at 3 pages of 24 -- 0.1% of a 66k catalogue,
      # and priced at the NATIONAL catalogue rather than at a store. See the grocery providers.
      categories: ["tecnologia", "electrodomesticos"]

      # The grocery aisles, dropped whichever query returned them (2026-09-25). Removing `mercado`
      # from `categories` was not enough: watch terms are also searched store-wide, and `sanitario`
      # kept bringing toilet brushes, cleaners and pet mats filed under Mercado back onto the feed.
      # Matched against the top level of Exito's own category path.
      excludeCategories: ["Mercado"]

  - id: carulla
    type: vtex
    # Same VTEX platform as Exito, so this integration is config only -- but the
    # taxonomy is NOT the same. Verified against carulla.com's own category tree:
    # Carulla is grocery-first and has NO "mercado" category. Groceries are split
    # into despensa / lacteos-huevos-y-refrigerados / frutas-y-verduras / etc.
    #
    # Beware: requesting a category that does not exist does NOT return 404. VTEX
    # answers 206 with an unfiltered product list, so a wrong slug here yields
    # plausible-looking but arbitrary results. VtexSource validates these slugs
    # against the live category tree on startup and warns.
    enabled: true
    baseUrl: "https://www.carulla.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      pageSize: "24"
      maxPagesPerCategory: "2"
    listOptions:
      # Broad categories, so default (best-seller) order -- see the note on Exito's.
      #
      # Groceries moved to `carulla-grocery` (2026-09-24), for the same reason as Exito's. Worth
      # knowing: nationally, Carulla's catalogue API priced some produce at 0 with 0 stock, and
      # only a store-scoped request returns the real shelf price.
      categories: ["tecnologia", "electrodomesticos"]

      # Same reason as Exito's. Carulla has no `Mercado` parent, so each grocery top level is named.
      # Aseo del hogar and Mascotas are listed too: they are grocery-store aisles, not feed items.
      excludeCategories:
        - "Frutas y verduras"
        - "Delicatessen"
        - "Lacteos, huevos y refrigerados"
        - "Panaderia"
        - "Despensa"
        - "Bebidas, snacks y dulces"
        - "Pollo, Carnes y pescado"
        - "Congelados"
        - "Comidas preparadas"
        - "Aseo del hogar"
        - "Mascotas"

  # ---------------------------------------------------------------------------------------
  # Groceries at Laureles -- the /groceries tab. See VtexGrocerySource and README "Groceries".
  #
  # One provider per physical store. `regionSeller` is that store's VTEX seller, which is what the
  # site's "¿Cómo quieres recibir tu pedido?" picker selects; prices and stock are that store's own.
  # Found via /api/checkout/pub/pickup-points?geoCoordinates=<lng>;<lat>:
  #   Carulla Laureles  carulla729   (Cq. 73B #39-20)
  #   Exito Laureles    exitocol037  (Cra. 81 #37-100)
  #   Exito Colombia    exitocol031  (Cra. 66 #49-1, Suramericana) -- added 2026-09-24
  #
  # `chain` groups stores of one retailer: the tab shows one row per product per chain, at the
  # cheaper of its stores, tagged with the store it came from. Each store keeps its own price
  # history, so "vs usual" always compares a store against itself. `storeLabel` is the tag.
  #
  # Why both Exitos: on a 400-item sample their prices differed on 7-17 of every 50 meat and produce
  # items (Lechuga crespa 6,780 at Laureles vs 4,120 at Colombia; Juan Valdez 454 g 29,925 vs 37,050),
  # dairy was identical, and 5-25% of items were stocked at only one of the two.
  #
  # Read inside daily WINDOWS, at a minute picked per store per day (`runWindows`, 2026-09-25; before
  # that fixed `runAtHours` 07:00/15:00). The minute is random-looking but fixed for the day, so a
  # restart does not re-roll it, and requests stop landing on the same :00 every morning. Checked every
  # 5 minutes, apart from the hourly cycle. A window missed while the Mac slept runs once at the next
  # check. Each crawl is ~250 requests per store, ~6 minutes.
  #
  # Why these windows. Exito reprices during the day: on 2026-09-25, 220 of 7,202 Laureles items
  # changed between the morning and afternoon crawls, 204 of them UP -- morning promotions ending, and
  # the homepage said so ("30% con Mastercard en frutas y verduras 6:00 am a 11:59 am"). Carulla moved
  # on 7 of 4,736. So Exito gets three runs and Carulla two, and the midday Exito run is at 10:30-11:55,
  # BEFORE noon -- a 12:00 run would miss exactly the promotions that end at 11:59.
  #
  # The two Exitos share www.exito.com, so their windows sit side by side and never overlap.
  # `staleAfterHours` is above 48 so a row is not retired if a whole day's crawls fail.
  #
  # `readBanners` fetches the storefront homepage once per crawl for its announcement-bar configs -- see
  # `site_banners` in V18. Set on ONE provider per host: the two Exitos share one homepage.
  #
  # `categories` entries are `path = Aisle label`; the label is what the tab filters by, and the
  # same aisle at both stores shares one label.
  #
  # DELIBERATELY NOT CRAWLED (2026-09-24), kept here in case they are wanted later. In-stock counts
  # at Laureles on that date:
  #   exito:   mercado/mascotas (3,310), mercado/aseo-del-hogar (2,336), cuidado-personal, vinos-y-licores
  #   carulla: mascotas, aseo-del-hogar, salud-y-belleza, vinos-y-licores
  # Adding one is a line below with a label.
  # ---------------------------------------------------------------------------------------
  - id: exito-grocery
    type: vtex-grocery
    enabled: true
    baseUrl: "https://www.exito.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      regionSeller: "exitocol037"
      storeLabel: "Exito Laureles"
      chain: "exito"
      staleAfterHours: "60"
      readBanners: "true"
    listOptions:
      # Three windows; see the header comment for why the midday one ends before noon.
      runWindows: ["07:00-07:40", "10:30-11:10", "17:00-17:40"]
      # Sizes at Laureles on 2026-09-24. `despensa` (2,965) is over the 2,500-per-query cap and
      # is split into its children automatically.
      categories:
        - "mercado/pollo-carne-y-pescado = Meat & fish"
        - "mercado/frutas-y-verduras = Fruit & veg"
        - "mercado/lacteos-huevos-y-refrigerados = Dairy & eggs"
        - "mercado/despensa = Pantry"
        - "mercado/charcuteria-y-delicatessen = Deli"
        - "mercado/panaderia-y-reposteria = Bakery"
        - "mercado/congelados = Frozen"
        - "mercado/bebidas = Drinks"
        - "mercado/pasabocas-y-snacks = Snacks & sweets"
        - "mercado/dulces-y-chocolateria = Snacks & sweets"
        - "mercado/comidas-preparadas = Prepared"
        - "mercado/alimentacion-para-bebes = Baby food"

  - id: exito-colombia-grocery
    type: vtex-grocery
    enabled: true
    baseUrl: "https://www.exito.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      regionSeller: "exitocol031"
      storeLabel: "Exito Colombia"
      chain: "exito"
      staleAfterHours: "60"
    listOptions:
      # Same aisles as exito-grocery, in the windows right after its own. Both Exitos are the one host,
      # www.exito.com, and adjacent non-overlapping windows keep their two ~6-minute crawls apart.
      runWindows: ["07:45-08:30", "11:15-11:55", "17:45-18:30"]
      categories:
        - "mercado/pollo-carne-y-pescado = Meat & fish"
        - "mercado/frutas-y-verduras = Fruit & veg"
        - "mercado/lacteos-huevos-y-refrigerados = Dairy & eggs"
        - "mercado/despensa = Pantry"
        - "mercado/charcuteria-y-delicatessen = Deli"
        - "mercado/panaderia-y-reposteria = Bakery"
        - "mercado/congelados = Frozen"
        - "mercado/bebidas = Drinks"
        - "mercado/pasabocas-y-snacks = Snacks & sweets"
        - "mercado/dulces-y-chocolateria = Snacks & sweets"
        - "mercado/comidas-preparadas = Prepared"
        - "mercado/alimentacion-para-bebes = Baby food"

  - id: carulla-grocery
    type: vtex-grocery
    enabled: true
    baseUrl: "https://www.carulla.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      regionSeller: "carulla729"
      storeLabel: "Carulla Laureles"
      chain: "carulla"
      staleAfterHours: "60"
      readBanners: "true"
    listOptions:
      # Twice, not three times: Carulla barely reprices during the day (7 of 4,736 on 2026-09-25).
      runWindows: ["07:00-08:00", "17:00-18:00"]
      # Top-level at Carulla, which has no `mercado` parent. Note `pollo-carnes-y-pescado` (plural)
      # against Exito's singular.
      categories:
        - "pollo-carnes-y-pescado = Meat & fish"
        - "frutas-y-verduras = Fruit & veg"
        - "lacteos-huevos-y-refrigerados = Dairy & eggs"
        - "despensa = Pantry"
        - "delicatessen = Deli"
        - "panaderia = Bakery"
        - "congelados = Frozen"
        - "bebidas-snacks-y-dulces/gaseosas-y-bebidas = Drinks"
        - "bebidas-snacks-y-dulces/dulces-y-chocolates = Snacks & sweets"
        - "bebidas-snacks-y-dulces/snacks = Snacks & sweets"
        - "bebidas-snacks-y-dulces/frutos-secos = Snacks & sweets"
        - "bebidas-snacks-y-dulces/galletas = Snacks & sweets"
        - "comidas-preparadas = Prepared"

  # ---------------------------------------------------------------------------------------
  # PriceSmart -- groceries at two Medellín warehouse clubs (added 2026-09-27). See PriceSmartSource
  # and README "PriceSmart".
  #
  # Not VTEX: Bloomreach Discovery behind the site's own POST /api/br_discovery/getProductsByKeyword.
  # The club is chosen by asking for per-club fields (`price_CO_6106`), so no cookie or browser. Clubs
  # found in the site's own config:
  #   Medellín Las Américas  6106  (Carrera 70 con Calle Primera)
  #   Medellín El Poblado    6110  (Carrera 32 # 11 Sur - 220)
  # Prices are member prices, and are in CENTS in the API (the adapter converts).
  #
  # Alimentos only, like the Exito and Carulla crawls. DELIBERATELY NOT CRAWLED (2026-09-27), in case
  # they are wanted later -- counts at Las Américas:
  #   Hogar H30D22: Productos de limpieza H30D52002 (68), Suministros de lavandería H30D52013 (45),
  #     Productos de papelería para el hogar H30D05011 (15)
  #   Salud y belleza H20D09 (170) -- personal care, oral care, vitamins
  #   Licor, cerveza y vino G10D08014 (143)
  #   Bebé B10D27: Pañales B10D09013 (18), Fórmula B10D09004 (8), Alimento para bebé B10D03003 (2)
  #   Mascotas P10D51: dog food P10D51004 (11), cat food P10D51001 (7)
  #
  # One chain, "pricesmart": the tab shows each product once, at whichever club is cheaper, like the two
  # Exitos. robots.txt allows /api/ for generic agents; it blocks named AI agents, curl and
  # python-requests outright -- proceeding was Luis's call, see README.
  #
  # ~23 requests per club per crawl (48 products a page). Windows are well clear of the Exito and Carulla
  # ones, and the two clubs never overlap: they share www.pricesmart.com.
  # ---------------------------------------------------------------------------------------
  - id: pricesmart-americas-grocery
    type: pricesmart
    enabled: true
    baseUrl: "https://www.pricesmart.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      club: "6106"
      storeLabel: "PriceSmart Las Américas"
      chain: "pricesmart"
      staleAfterHours: "60"
    listOptions:
      runWindows: ["08:40-09:10", "17:40-18:10"]
      # Every Alimentos (G10D03) subcategory, mapped to the tab's shared aisle labels so PriceSmart's meat
      # filters with Exito's and Carulla's. Sizes are Las Américas on 2026-09-27.
      categories:
        - "G10D07010 = Dairy & eggs"         # Lácteos y Huevos, 144
        - "G10D59015 = Meat & fish"          # Carnes, 114
        - "Poultry = Meat & fish"            # Aves, 40
        - "Seafood = Meat & fish"            # Mariscos y pescado, 30
        - "deli_meat = Deli"                 # Embutidos, 54
        - "G10D03009 = Pantry"               # Aceites, harinas y condimentos, 113
        - "G10D33005 = Pantry"               # Enlatados, 46
        - "G10D35013 = Pantry"               # Granos y pasta, 27
        - "G10D03007 = Pantry"               # Café y té, 28
        - "G10D03003 = Pantry"               # Cereales y granolas, 14
        - "G10D53001 = Drinks"               # Bebidas, 92
        - "G10D04018 = Fruit & veg"          # Frutas y vegetales, 89
        - "G10D02019 = Snacks & sweets"      # Snacks, 77
        - "G10D02004 = Snacks & sweets"      # Dulces, chocolates y chicles, 40
        - "G10D63008 = Snacks & sweets"      # Galletas, postres, y helados, 32
        - "Fresh_Bakery = Bakery"            # Panadería y repostería, 54
        - "G10D63002 = Bakery"               # Panes y tortillas, 21
        - "G10D06011 = Frozen"               # Comida congelada, 45
        - "G10D07017 = Prepared"             # Comidas preparadas, 17
        - "ready_to_eat = Prepared"          # Listo para comer, 15

  - id: pricesmart-poblado-grocery
    type: pricesmart
    enabled: true
    baseUrl: "https://www.pricesmart.com"
    currency: COP
    coShippingDefault: "YES"
    options:
      club: "6110"
      storeLabel: "PriceSmart El Poblado"
      chain: "pricesmart"
      staleAfterHours: "60"
    listOptions:
      runWindows: ["09:15-09:45", "18:15-18:45"]
      # Every Alimentos (G10D03) subcategory, mapped to the tab's shared aisle labels so PriceSmart's meat
      # filters with Exito's and Carulla's. Same aisles as Las Américas.
      categories:
        - "G10D07010 = Dairy & eggs"         # Lácteos y Huevos, 144
        - "G10D59015 = Meat & fish"          # Carnes, 114
        - "Poultry = Meat & fish"            # Aves, 40
        - "Seafood = Meat & fish"            # Mariscos y pescado, 30
        - "deli_meat = Deli"                 # Embutidos, 54
        - "G10D03009 = Pantry"               # Aceites, harinas y condimentos, 113
        - "G10D33005 = Pantry"               # Enlatados, 46
        - "G10D35013 = Pantry"               # Granos y pasta, 27
        - "G10D03007 = Pantry"               # Café y té, 28
        - "G10D03003 = Pantry"               # Cereales y granolas, 14
        - "G10D53001 = Drinks"               # Bebidas, 92
        - "G10D04018 = Fruit & veg"          # Frutas y vegetales, 89
        - "G10D02019 = Snacks & sweets"      # Snacks, 77
        - "G10D02004 = Snacks & sweets"      # Dulces, chocolates y chicles, 40
        - "G10D63008 = Snacks & sweets"      # Galletas, postres, y helados, 32
        - "Fresh_Bakery = Bakery"            # Panadería y repostería, 54
        - "G10D63002 = Bakery"               # Panes y tortillas, 21
        - "G10D06011 = Frozen"               # Comida congelada, 45
        - "G10D07017 = Prepared"             # Comidas preparadas, 17
