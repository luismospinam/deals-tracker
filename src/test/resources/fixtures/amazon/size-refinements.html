<!--
  Amazon's size-refinement rail, as served on 2026-09-21 with the project user agent.

  Trimmed from three real unfiltered search pages — `nike men shoes`, `nike men hoodie` and
  `nike men pants` — keeping only the size links, because that is all the discovery code reads.

  Three facts this fixture exists to pin:

   1. The refinement PARAMETER DIFFERS BY CATEGORY. Footwear uses `p_n_pt_nav_size_men_shoe`;
      apparel uses `p_n_pt_nav_size_men_international_size`. Assuming one name finds nothing on
      the other category.
   2. The rail's size LABELS are Amazon's short forms — `M`, `2XL` — and are NOT the spelled-out
      labels the product pages use (`Medium`, `XX-Large`). Both are Amazon's own wording for the
      same size, in different places.
   3. A page offers SEVERAL size dimensions at once. Pants carry international size AND waist AND
      big-and-tall; shoes carry shoe size AND width. Picking the wrong one silently filters by
      the wrong thing.
-->

<div id="filters">
